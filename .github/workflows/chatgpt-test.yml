name: ChatGPT Test
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try Drive download
        shell: bash
        run: |
          set +e
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1C_3x_OzXqaS2LaEaggiJaLbN0qmny_2o' -O input.zip 2>&1 | tee gdown.log
          ls -lh input.zip gdown.log 2>&1 | tee status.log
          file input.zip 2>&1 | tee -a status.log
          unzip -t input.zip 2>&1 | tee unzip.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-drive-test
          path: |
            input.zip
            gdown.log
            status.log
            unzip.log
          if-no-files-found: warn
