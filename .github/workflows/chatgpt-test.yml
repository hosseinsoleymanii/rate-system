name: ChatGPT TeacherShow Builder
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TeacherShow archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1VxpjSBHGEZFg3rvwtWJDCnaUqU2XDuz8' -O teachershow-v247.zip
          echo '=== INPUT ==='
          ls -lh teachershow-v247.zip
          file teachershow-v247.zip
          unzip -t teachershow-v247.zip | tail -n 5
          rm -rf work
          unzip -q teachershow-v247.zip -d work
          echo '=== ROOT ==='
          find work -maxdepth 3 -type f | head -n 100
          echo '=== KEY FILES ==='
          grep -RIl --include='*.php' --include='*.js' --include='*.css' -E 'ثبت پیام مدیر|معدل کتبی|نوبت اول|report.card|report_card|افزودن نمودار|نمودار' work | head -n 120
