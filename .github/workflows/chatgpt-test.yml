name: ChatGPT TeacherShow Builder
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TeacherShow archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q input/teachershow-v247.zip -d work
          python3 - <<'PY'
          from pathlib import Path
          root = Path('work')
          out = []
          out.append('=== FILE TREE ===')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          for p in files:
              out.append(str(p))
          needles = [
              'ثبت پیام مدیر', 'افزودن نمودار', 'معدل کتبی', 'نوبت اول',
              'report-card', 'report_card', 'chart', 'نمودار', 'written',
              'first_term', 'term_first', 'show_chart'
          ]
          out.append('\n=== MATCH CONTEXT ===')
          for p in files:
              if p.suffix.lower() not in {'.php','.js','.css','.json','.html','.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              lines = text.splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if any(n.lower() in line.lower() for n in needles):
                      hits.append(i)
              if not hits:
                  continue
              out.append(f'\n--- {p} ({len(hits)} hits) ---')
              shown=set()
              for i in hits:
                  a=max(0,i-4); b=min(len(lines),i+5)
                  key=(a,b)
                  if key in shown: continue
                  shown.add(key)
                  for j in range(a,b):
                      out.append(f'{j+1:05d}: {lines[j]}')
                  out.append('...')
          Path('diagnostic.txt').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out[-1200:]))
          PY
          unzip -t input/teachershow-v247.zip
      - uses: actions/upload-artifact@v4
        with:
          name: teachershow-inspection
          path: diagnostic.txt
