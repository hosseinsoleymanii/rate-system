name: ChatGPT TeacherShow Builder
on:
  pull_request:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TeacherShow archive
        shell: bash
        run: |
          set +e
          git clone -q --depth=1 --branch tmp-chatgpt-teachershow https://github.com/hosseinsoleymanii/rate-system.git repo
          cd repo
          echo '=== INPUT ==='
          ls -l input/teachershow-v247.zip
          file input/teachershow-v247.zip
          xxd -l 64 input/teachershow-v247.zip
          echo '=== ZIP TEST ==='
          unzip -t input/teachershow-v247.zip | tail -n 10
          rm -rf work
          unzip -q input/teachershow-v247.zip -d work
          echo "unzip status=$?"
          find work -maxdepth 3 -type f | head -n 80
          echo '=== KEY FILES ==='
          grep -RIl --include='*.php' --include='*.js' --include='*.css' -E 'ثبت پیام مدیر|معدل کتبی|نوبت اول|report.card|report_card|نمودار' work | head -n 80
          exit 0
